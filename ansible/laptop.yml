---
- hosts: laptop
  become: true

  tasks:
    - name: Security
      include_role:
        name: security

    - name: Base
      include_role:
        name: base

    - name: Desktop
      include_role:
        name: desktop

    - name: Data role
      include_role:
        name: data
      when: include_data_role | default(false) | bool
